apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: sabriboussami@gmail.com
      smtp_auth_username: sabriboussami@gmail.com
      smtp_auth_identity: sabriboussami@gmail.com
      smtp_auth_password_file: /etc/alertmanager/secret/smtp-auth-password
      smtp_require_tls: true

    route:
      group_by: ['alertname', 'instance', 'job', 'node']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: plansync-email

    receivers:
      - name: plansync-email
        email_configs:
          - to: sabri.boussami@esprit.tn,hamed.Nisrine@esprit.tn,azizifarouk2@gmail.com
            send_resolved: true
            headers:
              subject: '[PlanSync][{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
