apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  dashboards-provider.yaml: |
    apiVersion: 1
    providers:
      - name: plansync-application
        orgId: 1
        folder: PlanSync
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards/plansync
