apiVersion: v1
kind: ConfigMap
metadata:
  name: plansync-config-repo
  namespace: plansync
data:
  application.properties: |
    spring.cloud.discovery.enabled=true
    eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
    eureka.instance.prefer-ip-address=true
    management.endpoints.web.exposure.include=health,info
    management.endpoint.health.show-details=always

  eureka-server.properties: |
    server.port=8761
    spring.application.name=eureka-server
    spring.cloud.discovery.enabled=false
    eureka.client.register-with-eureka=false
    eureka.client.fetch-registry=false
    eureka.server.enable-self-preservation=false
    eureka.instance.hostname=eureka-server
    server.tomcat.threads.max=3
    server.tomcat.accept-count=20

  api-gateway.properties: |
    server.port=8085
    app.jwt.secret=${JWT_SECRET:ZGV2LWNoYW5nZS1tZS0zMi1ieXRlcy1taW1pbXVtLXNlY3JldA==}
    app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://192.168.1.171:30080,http://192.168.1.188:30080,http://192.168.1.171:30085,http://192.168.1.188:30085}

    spring.cloud.gateway.routes[0].id=user-service-route
    spring.cloud.gateway.routes[0].uri=http://user-service:8079
    spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

    spring.cloud.gateway.routes[1].id=projet-service-route
    spring.cloud.gateway.routes[1].uri=http://projet-service:8082
    spring.cloud.gateway.routes[1].predicates[0]=Path=/api/projects/**,/api/project-documents/**,/api/project-meetings/**,/api/milestones/**,/api/project-notifications/**

    spring.cloud.gateway.routes[2].id=user-service-users-route
    spring.cloud.gateway.routes[2].uri=http://user-service:8079
    spring.cloud.gateway.routes[2].predicates[0]=Path=/api/users/**

    spring.cloud.gateway.routes[3].id=user-service-avatars-route
    spring.cloud.gateway.routes[3].uri=http://user-service:8079
    spring.cloud.gateway.routes[3].predicates[0]=Path=/avatars/**

    spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

    spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://192.168.1.188:30080,http://192.168.1.171:30080
    spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
    spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
    spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
    spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

    management.health.eureka.enabled=false
    management.endpoints.web.exposure.include=health,info
    management.endpoint.health.show-details=always
    server.tomcat.threads.max=3
    server.tomcat.accept-count=20

  user-service.properties: |
    server.port=8079
    server.servlet.context-path=/
    spring.datasource.url=jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:plansync_db_user}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    spring.datasource.username=${DB_USERNAME:root}
    spring.datasource.password=${DB_PASSWORD:}
    spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
    spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=false
    spring.jpa.open-in-view=false
    app.jwt.secret=${JWT_SECRET:ZGV2LWNoYW5nZS1tZS0zMi1ieXRlcy1taW1pbXVtLXNlY3JldA==}
    app.jwt.access-token-ttl=PT12H
    app.jwt.refresh-token-ttl=P30D
    app.avatar.local-dir=/app/uploads/avatars
    app.avatar.public-path=/avatars/
    app.avatar.public-base-url=${APP_AVATAR_PUBLIC_BASE_URL:http://192.168.1.171:30080/avatars}
    spring.mail.host=smtp.gmail.com
    spring.mail.port=587
    spring.mail.username=sabriboussami@gmail.com
    spring.mail.password=${SMTP_PASSWORD:}
    spring.mail.properties.mail.smtp.auth=true
    spring.mail.properties.mail.smtp.starttls.enable=true
    spring.mail.properties.mail.smtp.starttls.required=true
    spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
    spring.mail.properties.mail.smtp.connectiontimeout=5000
    spring.mail.properties.mail.smtp.timeout=5000
    spring.mail.properties.mail.smtp.writetimeout=5000
    app.frontend-url=${APP_FRONTEND_URL:http://192.168.1.188:30080}
    app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://192.168.1.171:30080,http://192.168.1.188:30080}
    app.user-usage.timezone=Africa/Tunis
    management.health.mail.enabled=false
    management.endpoints.web.exposure.include=health,info
    management.endpoint.health.show-details=always
    server.tomcat.threads.max=3
    server.tomcat.accept-count=20

  projet-service.properties: |
    server.port=8082
    spring.datasource.url=jdbc:mysql://mysql:3306/plansync_projet_db?createDatabaseIfNotExist=true&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    spring.datasource.username=root
    spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
    spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
    spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=false
    spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
    spring.jackson.serialization.fail-on-empty-beans=false
    spring.jackson.time-zone=Africa/Tunis
    spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Tunis
    app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://192.168.1.171:30080,http://192.168.1.188:30080}
    app.jwt.secret=${JWT_SECRET:ZGV2LWNoYW5nZS1tZS0zMi1ieXRlcy1taW1pbXVtLXNlY3JldA==}
    app.frontend-url=${APP_FRONTEND_URL:http://192.168.1.188:30080}
    app.mail.from=no-reply@plansync.local
    app.notifications.reminder-cron=0 0 9 * * *
    app.notifications.cleanup-cron=0 0 8 * * *
    app.notifications.cleanup-timezone=Africa/Tunis
    spring.mail.host=smtp.gmail.com
    spring.mail.port=587
    spring.mail.username=sabriboussami@gmail.com
    spring.mail.password=${SMTP_PASSWORD:}
    spring.mail.properties.mail.smtp.auth=true
    spring.mail.properties.mail.smtp.starttls.enable=true
    spring.mail.properties.mail.smtp.starttls.required=true
    user-service.url=${USER_SERVICE_URL:http://user-service:8079}
    management.health.mail.enabled=false
    management.health.eureka.enabled=false
    management.endpoints.web.exposure.include=health,info
    management.endpoint.health.show-details=always
    logging.level.com.microservices.project=INFO
    logging.level.org.hibernate.SQL=INFO
