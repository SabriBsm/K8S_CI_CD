apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: plansync-services
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - api-gateway.plansync.svc.cluster.local:8085
              - user-service.plansync.svc.cluster.local:8079
              - projet-service.plansync.svc.cluster.local:8082
              - ticket-service.plansync.svc.cluster.local:8088
              - config-server.plansync.svc.cluster.local:8888
              - eureka-server.plansync.svc.cluster.local:8761

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc.cluster.local:8080"]

      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            regex: monitoring
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_host_ip]
            regex: (.+)
            replacement: $1:9100
            target_label: instance
