apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.monitoring.svc.cluster.local:9093

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: plansync-services
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - api-gateway.plansync.svc.cluster.local:8085
              - user-service.plansync.svc.cluster.local:8079
              - projet-service.plansync.svc.cluster.local:8082
              - ticket-service.plansync.svc.cluster.local:8088
              - config-server.plansync.svc.cluster.local:8888
              - eureka-server.plansync.svc.cluster.local:8761

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.monitoring.svc.cluster.local:8080"]

      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            regex: monitoring
            action: keep
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: node-exporter
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
          - source_labels: [__meta_kubernetes_pod_host_ip]
            regex: (.+)
            replacement: $1:9100
            target_label: instance
  alerts.yml: |
    groups:
      - name: plansync-application-alerts
        rules:
          - alert: PlanSyncServiceDown
            expr: up{job="plansync-services"} == 0
            for: 2m
            labels:
              severity: critical
              category: availability
            annotations:
              summary: "Service PlanSync indisponible"
              description: "Le service {{ $labels.instance }} est DOWN depuis plus de 2 minutes."

          - alert: PlanSyncHigh5xxRate
            expr: |
              (
                sum by(instance) (rate(http_server_requests_seconds_count{job="plansync-services",status=~"5.."}[5m]))
                /
                clamp_min(sum by(instance) (rate(http_server_requests_seconds_count{job="plansync-services"}[5m])), 0.001)
              ) > 0.05
            for: 5m
            labels:
              severity: warning
              category: performance
            annotations:
              summary: "Taux d'erreurs 5xx eleve"
              description: "Le service {{ $labels.instance }} depasse 5% d'erreurs 5xx sur 5 minutes."

          - alert: PlanSyncHighP95Latency
            expr: |
              histogram_quantile(
                0.95,
                sum by(le, instance) (
                  rate(http_server_requests_seconds_bucket{job="plansync-services",uri!~"/actuator.*"}[5m])
                )
              ) > 1.2
            for: 10m
            labels:
              severity: warning
              category: performance
            annotations:
              summary: "Latence p95 elevee"
              description: "Le service {{ $labels.instance }} a une latence p95 > 1.2s depuis 10 minutes."

          - alert: PlanSyncHighJvmHeapUsage
            expr: |
              (
                100 * sum by(instance) (jvm_memory_used_bytes{job="plansync-services",area="heap"})
                /
                clamp_min(sum by(instance) (jvm_memory_max_bytes{job="plansync-services",area="heap"}), 1)
              ) > 90
            for: 10m
            labels:
              severity: warning
              category: memory
            annotations:
              summary: "Utilisation heap JVM elevee"
              description: "Le service {{ $labels.instance }} utilise plus de 90% de heap JVM."

      - name: plansync-node-alerts
        rules:
          - alert: NodeHighCPU
            expr: 100 * (1 - avg by(node) (rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m]))) > 90
            for: 10m
            labels:
              severity: warning
              category: node
            annotations:
              summary: "CPU node elevee"
              description: "Le node {{ $labels.node }} depasse 90% de CPU depuis 10 minutes."

          - alert: NodeHighMemory
            expr: |
              100 * (1 - (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"})) > 90
            for: 10m
            labels:
              severity: warning
              category: node
            annotations:
              summary: "Memoire node elevee"
              description: "Le node {{ $labels.node }} depasse 90% de memoire depuis 10 minutes."

          - alert: NodeExporterDown
            expr: up{job="node-exporter"} == 0
            for: 3m
            labels:
              severity: critical
              category: node
            annotations:
              summary: "Node exporter indisponible"
              description: "Le scrape node-exporter n'est plus disponible pour {{ $labels.instance }}."
