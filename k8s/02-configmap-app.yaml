apiVersion: v1
kind: ConfigMap
metadata:
  name: plansync-app-config
  namespace: plansync
data:
  SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "plansync_db_user"
  DB_USERNAME: "root"
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/plansync_projet_db?createDatabaseIfNotExist=true&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=UTC"
  SPRING_DATASOURCE_USERNAME: "root"
  USER_SERVICE_URL: "http://user-service:8079"
  APP_AVATAR_PUBLIC_BASE_URL: "http://192.168.1.171:30080"
  APP_FRONTEND_URL: "http://192.168.1.171:30080"
  APP_CORS_ALLOWED_ORIGINS: "http://192.168.1.171:30080,http://192.168.1.188:30080"
  CONFIG_REPO_PATH: "/config-repo"
