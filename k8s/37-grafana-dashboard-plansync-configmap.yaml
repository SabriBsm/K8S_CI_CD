apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-plansync
  namespace: monitoring
data:
  plansync-application-overview.json: |
    {
      "uid": "plansync-app-overview",
      "title": "PlanSync Application Overview",
      "tags": ["plansync", "application"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "15s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "instance",
            "label": "Service Instance",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": "label_values(up{job=\"plansync-services\"}, instance)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": {
              "selected": true,
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Services Up",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(up{job=\"plansync-services\",instance=~\"$instance\"})",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Availability (%)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(up{job=\"plansync-services\",instance=~\"$instance\"}) / clamp_min(count(up{job=\"plansync-services\",instance=~\"$instance\"}), 1)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "5xx Requests/s",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"plansync-services\",instance=~\"$instance\",status=~\"5..\"}[5m]))",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Pod Restarts (1h)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"plansync\"}[1h]))",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "HTTP Request Rate (req/s)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(instance) (rate(http_server_requests_seconds_count{job=\"plansync-services\",instance=~\"$instance\",uri!~\"/actuator.*\"}[5m]))",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "p95 Latency (s)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by(le, instance) (rate(http_server_requests_seconds_bucket{job=\"plansync-services\",instance=~\"$instance\",uri!~\"/actuator.*\"}[5m])))",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "5xx Error Rate (%)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum by(instance) (rate(http_server_requests_seconds_count{job=\"plansync-services\",instance=~\"$instance\",status=~\"5..\"}[5m])) / clamp_min(sum by(instance) (rate(http_server_requests_seconds_count{job=\"plansync-services\",instance=~\"$instance\"}[5m])), 0.001)",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "JVM Heap Usage (%)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum by(instance) (jvm_memory_used_bytes{job=\"plansync-services\",instance=~\"$instance\",area=\"heap\"}) / clamp_min(sum by(instance) (jvm_memory_max_bytes{job=\"plansync-services\",instance=~\"$instance\",area=\"heap\"}), 1)",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Process CPU Usage (%)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 20
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * avg by(instance) (process_cpu_usage{job=\"plansync-services\",instance=~\"$instance\"})",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Hikari Active Connections",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 20
          },
          "targets": [
            {
              "refId": "A",
              "expr": "hikaricp_connections_active{job=\"plansync-services\",instance=~\"$instance\"}",
              "legendFormat": "{{instance}}"
            }
          ]
        },
        {
          "id": 11,
          "type": "table",
          "title": "Current Service Status",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 28
          },
          "targets": [
            {
              "refId": "A",
              "expr": "up{job=\"plansync-services\",instance=~\"$instance\"}",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value": "up"
                }
              }
            }
          ]
        },
        {
          "id": 12,
          "type": "table",
          "title": "Top Pod Restarts (plansync)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 28
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(20, kube_pod_container_status_restarts_total{namespace=\"plansync\"})",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "service": true,
                  "uid": true
                },
                "renameByName": {
                  "Value": "restarts_total"
                }
              }
            }
          ]
        }
      ]
    }
  scalers-k8s-v2.json: |
    {
      "uid": "adtqlqr",
      "title": "Scalers-K8s_V2",
      "tags": ["k8s", "cluster"],
      "timezone": "Africa/Casablanca",
      "schemaVersion": 42,
      "version": 2,
      "editable": true,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Data source",
            "type": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "CPU usage per node (%)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - avg by(instance) (rate(node_cpu_seconds_total{job=\"node-exporter\",mode=\"idle\"}[5m]))) * on(instance) group_left(nodename) node_uname_info{job=\"node-exporter\"}",
              "legendFormat": "{{nodename}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Memory used per node (%)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - (node_memory_MemAvailable_bytes{job=\"node-exporter\"} / node_memory_MemTotal_bytes{job=\"node-exporter\"})) * on(instance) group_left(nodename) node_uname_info{job=\"node-exporter\"}",
              "legendFormat": "{{nodename}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Disk usage / per node (%)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (1 - (node_filesystem_avail_bytes{job=\"node-exporter\",mountpoint=\"/\",fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes{job=\"node-exporter\",mountpoint=\"/\",fstype!~\"tmpfs|overlay\"})) * on(instance) group_left(nodename) node_uname_info{job=\"node-exporter\"}",
              "legendFormat": "{{nodename}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Node Exporter Targets Up",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(up{job=\"node-exporter\"})",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Nodes Ready",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 8
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})",
              "instant": true
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "values": false
            }
          }
        },
        {
          "id": 6,
          "type": "table",
          "title": "Pods per namespace",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_pod_info) by (namespace)",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                }
              }
            }
          ]
        },
        {
          "id": 7,
          "type": "table",
          "title": "Top pod restarts",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 16
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(20, kube_pod_container_status_restarts_total)",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "service": true,
                  "uid": true
                }
              }
            }
          ]
        },
        {
          "id": 8,
          "type": "table",
          "title": "Current pod phases",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(namespace,pod,phase) (kube_pod_status_phase == 1)",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true
                }
              }
            }
          ]
        }
      ]
    }
