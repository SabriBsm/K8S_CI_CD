name: CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "k8s/**"
      - ".github/workflows/cd.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag override (default: short git SHA)"
        required: false
        type: string

concurrency:
  group: cd-plansync-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.detect.outputs.app_changed }}
      k8s_changed: ${{ steps.detect.outputs.k8s_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed paths
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          app_changed=false
          k8s_changed=false

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            app_changed=true
            k8s_changed=true
          else
            before_sha="${{ github.event.before }}"
            after_sha="${{ github.sha }}"

            if [ -z "${before_sha}" ] || [ "${before_sha}" = "0000000000000000000000000000000000000000" ]; then
              if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
                changed_files="$(git diff --name-only HEAD~1 HEAD)"
              else
                changed_files="$(git ls-files)"
              fi
            else
              changed_files="$(git diff --name-only "${before_sha}" "${after_sha}")"
            fi

            echo "Changed files:"
            echo "${changed_files}"

            if echo "${changed_files}" | grep -E '^(backend/|frontend/)' >/dev/null; then
              app_changed=true
            fi
            if echo "${changed_files}" | grep -E '^(k8s/|\.github/workflows/cd\.yml$)' >/dev/null; then
              k8s_changed=true
            fi
          fi

          echo "app_changed=${app_changed}" >> "$GITHUB_OUTPUT"
          echo "k8s_changed=${k8s_changed}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & Push Images
    needs: detect-changes
    if: needs.detect-changes.outputs.app_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: plansync-eureka-server
            context: ./backend/eureka-server
          - image: plansync-config-server
            context: ./backend/config-server
          - image: plansync-user-service
            context: ./backend/user-service
          - image: plansync-projet-service
            context: ./backend/projet-service
          - image: plansync-ticket-service
            context: ./backend/ticket-service
          - image: plansync-api-gateway
            context: ./backend/api-gateway
          - image: plansync-frontend
            context: ./frontend
    env:
      IMAGE_TAG: ${{ github.event.inputs.image_tag || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (retry)
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_CLIENT_TIMEOUT: 300
        run: |
          set -euo pipefail

          attempt=1
          max_attempts=6

          while [ "$attempt" -le "$max_attempts" ]; do
            echo "Docker Hub login attempt ${attempt}/${max_attempts}"
            if echo "${DOCKERHUB_TOKEN}" | docker login docker.io -u "${DOCKERHUB_USERNAME}" --password-stdin; then
              echo "Docker Hub login succeeded."
              exit 0
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep_seconds=$((attempt * 10))
              echo "Login failed. Retrying in ${sleep_seconds}s..."
              sleep "${sleep_seconds}"
            fi
            attempt=$((attempt + 1))
          done

          echo "Docker Hub login failed after ${max_attempts} attempts."
          exit 1

      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy to Kubernetes
    needs: [detect-changes, build-and-push]
    if: |
      always() &&
      (needs.detect-changes.outputs.app_changed == 'true' || needs.detect-changes.outputs.k8s_changed == 'true') &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped')
    runs-on: [self-hosted, linux, x64, plansync-k8s]
    timeout-minutes: 90
    env:
      NAMESPACE: plansync
      TAG: ${{ github.event.inputs.image_tag || github.sha }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify cluster access
        run: kubectl get nodes

      - name: Configure Docker Hub pull secret
        shell: bash
        run: |
          set -euo pipefail

          kubectl -n "$NAMESPACE" create secret docker-registry dockerhub-regcred \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="${DOCKERHUB_USERNAME}" \
            --docker-password="${DOCKERHUB_TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl patch serviceaccount default -n "$NAMESPACE" \
            --type='merge' \
            -p '{"imagePullSecrets":[{"name":"dockerhub-regcred"}]}'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configure Alertmanager Gmail secret
        shell: bash
        env:
          ALERTMANAGER_GMAIL_APP_PASSWORD: ${{ secrets.ALERTMANAGER_GMAIL_APP_PASSWORD }}
        run: |
          set -euo pipefail

          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -

          SMTP_PASSWORD="${ALERTMANAGER_GMAIL_APP_PASSWORD:-}"
          if [ -z "${SMTP_PASSWORD}" ]; then
            echo "ALERTMANAGER_GMAIL_APP_PASSWORD not set, fallback to plansync-secrets.smtp-password"
            SMTP_PASSWORD="$(kubectl get secret plansync-secrets -n plansync -o jsonpath='{.data.smtp-password}' | base64 -d)"
          fi

          if [ -z "${SMTP_PASSWORD}" ]; then
            echo "No SMTP password available for Alertmanager."
            exit 1
          fi

          kubectl -n monitoring create secret generic alertmanager-gmail \
            --from-literal=SMTP_AUTH_USERNAME='sabriboussami@gmail.com' \
            --from-literal=SMTP_AUTH_PASSWORD="${SMTP_PASSWORD}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/00-namespace.yaml
          kubectl apply -f k8s/01-secrets.yaml
          kubectl apply -f k8s/02-configmap-app.yaml
          kubectl apply -f k8s/03-configmap-config-repo.yaml
          kubectl apply -f k8s/04-configmap-mysql-init.yaml
          kubectl apply -f k8s/05-mysql-pvc.yaml
          kubectl apply -f k8s/06-avatars-pvc.yaml
          kubectl apply -f k8s/07-mysql-deployment.yaml
          kubectl apply -f k8s/08-mysql-service.yaml
          kubectl apply -f k8s/09-eureka-deployment.yaml
          kubectl apply -f k8s/10-eureka-service.yaml
          kubectl apply -f k8s/11-config-server-deployment.yaml
          kubectl apply -f k8s/12-config-server-service.yaml
          kubectl apply -f k8s/13-user-service-deployment.yaml
          kubectl apply -f k8s/14-user-service-service.yaml
          kubectl apply -f k8s/15-projet-service-deployment.yaml
          kubectl apply -f k8s/16-projet-service-service.yaml
          kubectl apply -f k8s/17-api-gateway-deployment.yaml
          kubectl apply -f k8s/18-api-gateway-service.yaml
          kubectl apply -f k8s/19-frontend-deployment.yaml
          kubectl apply -f k8s/20-frontend-service.yaml
          kubectl apply -f k8s/21-user-service-hpa.yaml
          kubectl apply -f k8s/22-projet-service-hpa.yaml
          kubectl apply -f k8s/23-ingress.yaml
          kubectl apply -f https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.36/deploy/local-path-storage.yaml
          kubectl apply -f k8s/24-monitoring-namespace.yaml
          kubectl apply -f k8s/25-prometheus-configmap.yaml
          kubectl apply -f k8s/26-prometheus-pvc.yaml
          kubectl apply -f k8s/27-prometheus-deployment.yaml
          kubectl apply -f k8s/28-prometheus-service.yaml
          kubectl apply -f k8s/29-grafana-secret.yaml
          kubectl apply -f k8s/30-grafana-datasource-configmap.yaml
          kubectl apply -f k8s/36-grafana-dashboard-provider-configmap.yaml
          kubectl apply -f k8s/37-grafana-dashboard-plansync-configmap.yaml
          kubectl apply -f k8s/31-grafana-pvc.yaml
          kubectl apply -f k8s/32-grafana-deployment.yaml
          kubectl apply -f k8s/33-grafana-service.yaml
          kubectl apply -f k8s/34-kube-state-metrics.yaml
          kubectl apply -f k8s/35-node-exporter.yaml
          kubectl apply -f k8s/38-prometheus-rbac.yaml
          kubectl apply -f k8s/39-ticket-service-deployment.yaml
          kubectl apply -f k8s/40-ticket-service-service.yaml
          kubectl apply -f k8s/41-alertmanager-configmap.yaml
          kubectl apply -f k8s/42-alertmanager-deployment.yaml
          kubectl apply -f k8s/43-alertmanager-service.yaml
          kubectl apply -f k8s/44-monitoring-ingress.yaml

      - name: Rollout monitoring stack
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail

          wait_monitoring_deploy() {
            local dep="$1"
            local max_attempts=3
            local attempt=1

            while [ "$attempt" -le "$max_attempts" ]; do
              echo "=== Monitoring rollout: ${dep} (attempt ${attempt}/${max_attempts}) ==="
              if kubectl rollout status "deploy/${dep}" -n monitoring --timeout=600s; then
                return 0
              fi

              echo "Rollout failed for ${dep}, collecting diagnostics..."
              kubectl get deploy "${dep}" -n monitoring -o wide || true
              kubectl get rs -n monitoring -l app="${dep}" || true
              kubectl get pods -n monitoring -l app="${dep}" -o wide || true

              for pod in $(kubectl get pods -n monitoring -l app="${dep}" --no-headers 2>/dev/null | awk '{print $1}'); do
                echo "--- describe pod/${pod} ---"
                kubectl describe pod "${pod}" -n monitoring || true
                echo "--- logs pod/${pod} ---"
                kubectl logs "${pod}" -n monitoring --tail=200 || true
                echo "--- previous logs pod/${pod} ---"
                kubectl logs "${pod}" -n monitoring --previous --tail=200 || true
              done

              kubectl get pods -n monitoring -l app="${dep}" \
                -o custom-columns=NAME:.metadata.name,WAIT:.status.containerStatuses[0].state.waiting.reason --no-headers \
                | awk '$2=="ImagePullBackOff" || $2=="ErrImagePull" || $2=="ContainerCreating" {print $1}' \
                | xargs -r kubectl delete pod -n monitoring --grace-period=0 --force || true

              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep 20
              fi
              attempt=$((attempt + 1))
            done

            echo "Monitoring rollout failed after ${max_attempts} attempts: ${dep}"
            return 1
          }

          wait_monitoring_daemonset() {
            local ds="$1"
            local max_attempts=2
            local attempt=1

            while [ "$attempt" -le "$max_attempts" ]; do
              echo "=== Monitoring daemonset rollout: ${ds} (attempt ${attempt}/${max_attempts}) ==="
              if kubectl rollout status "ds/${ds}" -n monitoring --timeout=600s; then
                return 0
              fi

              kubectl get ds "${ds}" -n monitoring -o wide || true
              kubectl get pods -n monitoring -l app="${ds}" -o wide || true
              kubectl get pods -n monitoring -l app="${ds}" --no-headers 2>/dev/null | awk '{print $1}' | while read -r pod; do
                [ -z "${pod}" ] && continue
                kubectl describe pod "${pod}" -n monitoring || true
                kubectl logs "${pod}" -n monitoring --tail=120 || true
              done

              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep 20
              fi
              attempt=$((attempt + 1))
            done

            echo "Monitoring daemonset rollout failed after ${max_attempts} attempts: ${ds}"
            return 1
          }

          wait_monitoring_deploy alertmanager
          wait_monitoring_deploy kube-state-metrics
          wait_monitoring_daemonset node-exporter

          kubectl rollout restart deploy/alertmanager -n monitoring
          wait_monitoring_deploy alertmanager
          kubectl rollout restart deploy/grafana -n monitoring
          wait_monitoring_deploy grafana
          kubectl rollout restart deploy/prometheus -n monitoring
          wait_monitoring_deploy prometheus

      - name: Flannel + DNS preflight
        shell: bash
        run: |
          set -euo pipefail

          kubectl -n kube-flannel patch ds kube-flannel-ds --type='json' \
            -p='[{"op":"replace","path":"/spec/template/spec/containers/0/args","value":["--ip-masq","--kube-subnet-mgr","--iface=ens3"]}]'
          kubectl rollout status ds/kube-flannel-ds -n kube-flannel --timeout=300s

          WORKER_NODES=$(kubectl get nodes -l '!node-role.kubernetes.io/control-plane' -o jsonpath='{.items[*].metadata.name}')
          if [ -z "${WORKER_NODES}" ]; then
            echo "No worker nodes found"
            exit 1
          fi

          for node in ${WORKER_NODES}; do
            echo "=== Network check on ${node} ==="
            pod="netcheck-${node}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            kubectl delete pod "${pod}" -n "$NAMESPACE" --ignore-not-found=true >/dev/null 2>&1 || true
            kubectl run "${pod}" --restart=Never -n "$NAMESPACE" --image=busybox:1.36 \
              --overrides="{\"spec\":{\"nodeSelector\":{\"kubernetes.io/hostname\":\"${node}\"}}}" \
              --command -- sh -ec '
                nslookup kubernetes.default.svc.cluster.local >/dev/null
                nslookup mysql.plansync.svc.cluster.local >/dev/null
                nc -zvw3 mysql 3306
              '

            success=false
            for i in $(seq 1 60); do
              phase="$(kubectl get pod "${pod}" -n "$NAMESPACE" -o jsonpath="{.status.phase}" 2>/dev/null || true)"
              if [ "${phase}" = "Succeeded" ]; then
                success=true
                break
              fi
              if [ "${phase}" = "Failed" ]; then
                echo "Netcheck failed on ${node}"
                kubectl logs "${pod}" -n "$NAMESPACE" || true
                kubectl describe pod "${pod}" -n "$NAMESPACE" || true
                kubectl delete pod "${pod}" -n "$NAMESPACE" --ignore-not-found=true || true
                exit 1
              fi
              sleep 2
            done

            if [ "${success}" != "true" ]; then
              echo "Netcheck timeout on ${node}"
              kubectl logs "${pod}" -n "$NAMESPACE" || true
              kubectl describe pod "${pod}" -n "$NAMESPACE" || true
              kubectl delete pod "${pod}" -n "$NAMESPACE" --ignore-not-found=true || true
              exit 1
            fi

            kubectl delete pod "${pod}" -n "$NAMESPACE" --ignore-not-found=true || true
          done

      - name: Rollout eureka-server
        if: needs.detect-changes.outputs.app_changed == 'true'
        run: |
          kubectl set image deploy/eureka-server -n "$NAMESPACE" eureka-server="$DOCKERHUB_USERNAME/plansync-eureka-server:$TAG"

      - name: Rollout config-server
        if: needs.detect-changes.outputs.app_changed == 'true'
        run: |
          kubectl set image deploy/config-server -n "$NAMESPACE" config-server="$DOCKERHUB_USERNAME/plansync-config-server:$TAG"

      - name: Rollout user-service
        if: needs.detect-changes.outputs.app_changed == 'true'
        run: |
          kubectl set image deploy/user-service -n "$NAMESPACE" user-service="$DOCKERHUB_USERNAME/plansync-user-service:$TAG"

      - name: Rollout projet-service
        if: needs.detect-changes.outputs.app_changed == 'true'
        run: |
          kubectl set image deploy/projet-service -n "$NAMESPACE" projet-service="$DOCKERHUB_USERNAME/plansync-projet-service:$TAG"

      - name: Rollout ticket-service
        if: needs.detect-changes.outputs.app_changed == 'true'
        run: |
          kubectl set image deploy/ticket-service -n "$NAMESPACE" ticket-service="$DOCKERHUB_USERNAME/plansync-ticket-service:$TAG"

      - name: Rollout api-gateway
        if: needs.detect-changes.outputs.app_changed == 'true'
        run: |
          kubectl set image deploy/api-gateway -n "$NAMESPACE" api-gateway="$DOCKERHUB_USERNAME/plansync-api-gateway:$TAG"

      - name: Rollout frontend
        if: needs.detect-changes.outputs.app_changed == 'true'
        run: |
          kubectl set image deploy/frontend -n "$NAMESPACE" frontend="$DOCKERHUB_USERNAME/plansync-frontend:$TAG"

      - name: Remove old legacy env var
        if: needs.detect-changes.outputs.app_changed == 'true'
        run: kubectl set env deploy/user-service -n "$NAMESPACE" APP_CORS_ALLOWED_ORIGIN- || true

      - name: Verify final rollouts
        if: needs.detect-changes.outputs.app_changed == 'true'
        shell: bash
        timeout-minutes: 35
        run: |
          set -euo pipefail

          wait_rollout() {
            local dep="$1"
            local max_attempts=3
            local attempt=1

            while [ "$attempt" -le "$max_attempts" ]; do
              echo "=== Rollout: $dep (attempt $attempt/$max_attempts) ==="
              if kubectl rollout status "deploy/$dep" -n "$NAMESPACE" --timeout=900s; then
                return 0
              fi

              echo "Rollout attempt $attempt failed for $dep. Collecting diagnostics..."
              kubectl get deploy "$dep" -n "$NAMESPACE" -o wide || true
              kubectl get rs -n "$NAMESPACE" -l app="$dep" || true
              kubectl get pods -n "$NAMESPACE" -l app="$dep" -o wide || true

              for pod in $(kubectl get pods -n "$NAMESPACE" -l app="$dep" --no-headers | awk '$2 !~ /^1\/1$/ {print $1}'); do
                echo "--- describe pod/$pod ---"
                kubectl describe pod "$pod" -n "$NAMESPACE" || true
                cname="$(kubectl get pod "$pod" -n "$NAMESPACE" -o jsonpath='{.spec.containers[0].name}' 2>/dev/null || true)"
                if [ -n "${cname}" ]; then
                  echo "--- logs pod/$pod (container: $cname) ---"
                  kubectl logs "$pod" -n "$NAMESPACE" -c "$cname" --tail=200 || true
                  echo "--- previous logs pod/$pod (container: $cname) ---"
                  kubectl logs "$pod" -n "$NAMESPACE" -c "$cname" --previous --tail=200 || true
                fi
              done

              # Remove pods stuck terminating and image-pull transient failures, then retry.
              kubectl get pods -n "$NAMESPACE" -l app="$dep" | awk '/Terminating/{print $1}' | xargs -r kubectl delete pod -n "$NAMESPACE" --grace-period=0 --force || true
              kubectl get pods -n "$NAMESPACE" -l app="$dep" \
                -o custom-columns=NAME:.metadata.name,READY:.status.containerStatuses[0].ready,WAIT:.status.containerStatuses[0].state.waiting.reason --no-headers \
                | awk '$2=="false" && ($3=="ImagePullBackOff" || $3=="ErrImagePull" || $3=="ContainerCreating") {print $1}' \
                | xargs -r kubectl delete pod -n "$NAMESPACE" --grace-period=0 --force || true

              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep 20
              fi
              attempt=$((attempt + 1))
            done

            echo "Rollout failed after ${max_attempts} attempts: $dep"
            return 1
          }

          wait_rollout mysql
          wait_rollout eureka-server
          wait_rollout config-server
          wait_rollout user-service
          wait_rollout projet-service
          wait_rollout ticket-service
          wait_rollout api-gateway
          wait_rollout frontend

      - name: Final status
        run: |
          kubectl get pods -n "$NAMESPACE" -o wide
          kubectl get ingress -A -o wide
