## Server Configuration
server.port=${SERVER_PORT:8079}
server.servlet.context-path=/
spring.application.name=user-service
spring.config.import=optional:configserver:http://localhost:8888

## Database Configuration (MySQL)
## createDatabaseIfNotExist allows the schema to be created automatically when the app connects,
## but MySQL server must be running and the user must have permission to create databases.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:plansync_db_user}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

## Logging Configuration
logging.level.root=INFO
logging.level.com.microservices.userservice=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

## SpringDoc OpenAPI (Swagger)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

## Application Configuration
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

## JWT (Access token expires in 5 minutes => "session timeout" for APIs)
# IMPORTANT: override this in env var JWT_SECRET (base64, >= 32 bytes once decoded).
app.jwt.secret=${JWT_SECRET:ZGV2LWNoYW5nZS1tZS0zMi1ieXRlcy1taW5pbXVtLXNlY3JldA==}
app.jwt.access-token-ttl=PT12H
app.jwt.refresh-token-ttl=P30D

## Avatar storage configuration
app.avatar.local-dir=uploads/avatars
app.avatar.public-path=/avatars/
app.avatar.public-base-url=http://localhost:${SERVER_PORT:8079}

## Email Configuration (SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=sabriboussami@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

## Frontend URL used in password reset emails
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}

## Usage analytics configuration
app.user-usage.timezone=${USER_USAGE_TIMEZONE:Africa/Tunis}

## Eureka Client Configuration
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=${EUREKA_HOST:localhost}
eureka.instance.prefer-ip-address=false


server.tomcat.threads.max=3
server.tomcat.accept-count=20
