# Configuration sp�cifique � api-gateway
server.port=8085

# JWT validation (same secret as user-service)
app.jwt.secret=${JWT_SECRET:ZGV2LWNoYW5nZS1tZS0zMi1ieXRlcy1taW1pbXVtLXNlY3JldA==}

# Routes Auth Services to User Service
spring.cloud.gateway.routes[0].id=user-service-route
spring.cloud.gateway.routes[0].uri=http://user-service:8079
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Route Project Services
spring.cloud.gateway.routes[1].id=projet-service-route
spring.cloud.gateway.routes[1].uri=http://projet-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/projects/**,/api/project-documents/**,/api/project-meetings/**,/api/milestones/**,/api/project-notifications/**

# Route User Services (protected)
spring.cloud.gateway.routes[2].id=user-service-users-route
spring.cloud.gateway.routes[2].uri=http://user-service:8079
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/users/**

# Route avatars (public)
spring.cloud.gateway.routes[3].id=user-service-avatars-route
spring.cloud.gateway.routes[3].uri=http://user-service:8079
spring.cloud.gateway.routes[3].predicates[0]=Path=/avatars/**

# Ticket API routes
spring.cloud.gateway.routes[4].id=ticket-service-route
spring.cloud.gateway.routes[4].uri=http://ticket-service:8088
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/ticket/**,/api/response/**,/api/channel/**,/api/ai/**

# Ticket API compatibility route (frontend base /api/tickets)
spring.cloud.gateway.routes[5].id=ticket-service-compat-route
spring.cloud.gateway.routes[5].uri=http://ticket-service:8088
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/tickets/**
spring.cloud.gateway.routes[5].filters[0]=StripPrefix=2
spring.cloud.gateway.routes[5].filters[1]=PrefixPath=/api

# WebSocket/SockJS route for ticket chat
spring.cloud.gateway.routes[6].id=ticket-service-ws-route
spring.cloud.gateway.routes[6].uri=http://ticket-service:8088
spring.cloud.gateway.routes[6].predicates[0]=Path=/ws/**

# Strip duplicate CORS headers added by downstream services
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://192.168.1.171:30080,http://192.168.1.188:30080}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=${APP_CORS_ALLOWED_ORIGINS:http://192.168.1.171:30080,http://192.168.1.188:30080}
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.add-to-simple-url-handler-mapping=true

# Thread tuning
server.tomcat.threads.max=3
server.tomcat.accept-count=20

