# Configuration spécifique à gestion-risk
server.port=8089
server.servlet.context-path=/

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/plansync_risk_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.mail.javamail=DEBUG

# Swagger (disabled temporarily)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# JWT validation (same secret as user-service)
app.jwt.secret=${JWT_SECRET:ZGV2LWNoYW5nZS1tZS0zMi1ieXRlcy1taW1pbXVtLXNlY3JldA==}

# External AI integrations
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.url=${OPENROUTER_URL:https://openrouter.ai/api/v1/chat/completions}
openrouter.chatbot.api.key=${OPENROUTER_CHATBOT_API_KEY:${OPENROUTER_API_KEY:}}
openrouter.detection.api.key=${OPENROUTER_DETECTION_API_KEY:${OPENROUTER_API_KEY:}}
spring.jackson.default-property-inclusion=always
spring.jackson.mapper.accept-case-insensitive-enums=true

# Email Notifications
notification.email.enabled=true
notification.email.to=hamednesrine3@gmail.com
notification.email.from=

# SMTP (Gmail)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=hamednesrine3@gmail.com
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

services.projet.url=http://localhost:8082

