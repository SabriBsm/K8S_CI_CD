server.port=8085
spring.application.name=api-gateway
spring.config.import=optional:configserver:http://localhost:8888

management.endpoints.web.exposure.include=health,info

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

## JWT validation (same secret as user-service)
app.jwt.secret=${JWT_SECRET:ZGV2LWNoYW5nZS1tZS0zMi1ieXRlcy1taW5pbXVtLXNlY3JldA==}

# Route Auth Services to User Service
spring.cloud.gateway.routes[0].id=user-service-route
spring.cloud.gateway.routes[0].uri=lb://user-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Route Project Services
spring.cloud.gateway.routes[1].id=projet-service-route
spring.cloud.gateway.routes[1].uri=lb://projet-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/projects/**

# Route User Services (protected)
spring.cloud.gateway.routes[2].id=user-service-users-route
spring.cloud.gateway.routes[2].uri=lb://user-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/users/**

# Route avatars (public)
spring.cloud.gateway.routes[3].id=user-service-avatars-route
spring.cloud.gateway.routes[3].uri=lb://user-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/avatars/**


server.tomcat.threads.max=3
server.tomcat.accept-count=20