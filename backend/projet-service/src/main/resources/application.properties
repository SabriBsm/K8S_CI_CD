spring.application.name=projet-service
spring.config.import=optional:configserver:http://localhost:8888,optional:file:.env[.properties]

# Load local environment overrides from a .env file when present

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}

# Database - CORRIGE
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/plansync_projet_db?createDatabaseIfNotExist=true&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Nommage des colonnes Hibernate 6
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.springframework.boot.orm.jpa.hibernate.SpringImplicitNamingStrategy
#spring.sql.init.mode=always
#spring.sql.init.data-locations=classpath:schema.sql

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false

# Server
server.port=8082

# CORS (frontend dev server)
app.cors.allowed-origins=http://localhost:4200

# JWT validation (same secret as user-service)
app.jwt.secret=${JWT_SECRET:ZGV2LWNoYW5nZS1tZS0zMi1ieXRlcy1taW5pbXVtLXNlY3JldA==}

# Email notifications
app.frontend-url=${APP_FRONTEND_URL:http://localhost:4200}
app.mail.from=${MAIL_FROM:no-reply@plansync.local}
app.notifications.reminder-cron=0 0 9 * * *
app.notifications.cleanup-cron=${NOTIFICATIONS_CLEANUP_CRON:0 0 8 * * *}
app.notifications.cleanup-timezone=${NOTIFICATIONS_CLEANUP_TIMEZONE:Africa/Tunis}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=sabriboussami@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Logging
logging.level.com.microservices.project=DEBUG
logging.level.org.hibernate.SQL=DEBUG

#Fuseau horaire
spring.jackson.time-zone=Africa/Tunis
spring.jpa.properties.hibernate.jdbc.time_zone=Africa/Tunis

# User Service Client Configuration
user-service.url=${USER_SERVICE_URL:http://localhost:8079}
finance-service.url=${FINANCE_SERVICE_URL:http://localhost:8090}

