<div class="auth-wrapper">
  <div class="forgot-card">
    <div class="card-header">
      <div class="icon-wrap"><i class="pi pi-lock"></i></div>
      <h3>Reset your password</h3>
      <p>Enter your email and we'll send you a reset link</p>
    </div>

    <p-messages [(value)]="messages" [closable]="true"></p-messages>

    <ng-container *ngIf="!submitted; else successTpl">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <div class="form-field">
          <label for="email">Email address</label>
          <span class="p-input-icon-left w-full">
            <i class="pi pi-envelope"></i>
            <input
              id="email"
              pInputText
              formControlName="email"
              type="email"
              placeholder="you@company.com"
              class="w-full"
              [class.ng-invalid]="isInvalid('email')"
              [class.ng-dirty]="isInvalid('email')" />
          </span>
          <small *ngIf="isInvalid('email')" class="field-error">
            <span *ngIf="form.get('email')?.errors?.['required']">Email is required</span>
            <span *ngIf="form.get('email')?.errors?.['email']">Enter a valid email address</span>
          </small>
        </div>
        <button
          pButton
          pRipple
          type="submit"
          label="Send reset link"
          icon="pi pi-send"
          iconPos="right"
          class="w-full submit-btn"
          [loading]="loading">
        </button>
      </form>
    </ng-container>

    <ng-template #successTpl>
      <div class="success-state">
        <i class="pi pi-check-circle success-icon"></i>
        <p>Check your inbox! We've sent a password reset link to <strong>{{ form.value.email }}</strong></p>
        <p class="hint-text">Didn't receive an email? Check your spam folder or try again with a different email.</p>
      </div>
    </ng-template>

    <p class="back-link"><a routerLink="/auth/login"><i class="pi pi-arrow-left"></i> Back to sign in</a></p>
  </div>
</div>
