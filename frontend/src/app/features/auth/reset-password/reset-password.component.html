<div class="auth-wrapper">
  <div class="reset-card">
    <div class="card-header">
      <div class="icon-wrap"><i class="pi pi-lock-open"></i></div>
      <h3>Set new password</h3>
      <p>Create a strong password for your account</p>
    </div>

    <p-messages [(value)]="messages" [closable]="true"></p-messages>

    <ng-container *ngIf="!submitted && token; else successTpl">
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <!-- New Password -->
        <div class="form-field">
          <label for="newPassword">New Password</label>
          <span class="p-input-icon-left w-full">
            <i class="pi pi-lock"></i>
            <p-password
              id="newPassword"
              formControlName="newPassword"
              placeholder="At least 8 characters"
              [feedback]="false"
              [toggleMask]="true"
              styleClass="w-full"
              inputStyleClass="w-full"
              [class.ng-invalid]="isInvalid('newPassword')"
              [class.ng-dirty]="isInvalid('newPassword')">
            </p-password>
          </span>
          <small *ngIf="isInvalid('newPassword')" class="field-error">
            <span *ngIf="form.get('newPassword')?.errors?.['required']">Password is required</span>
            <span *ngIf="form.get('newPassword')?.errors?.['minlength']">Minimum 8 characters</span>
          </small>
        </div>

        <!-- Confirm Password -->
        <div class="form-field">
          <label for="confirmPassword">Confirm Password</label>
          <span class="p-input-icon-left w-full">
            <i class="pi pi-lock"></i>
            <p-password
              id="confirmPassword"
              formControlName="confirmPassword"
              placeholder="Confirm your password"
              [feedback]="false"
              [toggleMask]="true"
              styleClass="w-full"
              inputStyleClass="w-full"
              [class.ng-invalid]="isInvalid('confirmPassword')"
              [class.ng-dirty]="isInvalid('confirmPassword')">
            </p-password>
          </span>
          <small *ngIf="isInvalid('confirmPassword')" class="field-error">
            <span *ngIf="form.get('confirmPassword')?.errors?.['required']">Please confirm your password</span>
          </small>
          <small *ngIf="getPasswordError()" class="field-error">{{ getPasswordError() }}</small>
        </div>

        <!-- Submit -->
        <button
          pButton
          pRipple
          type="submit"
          label="Reset Password"
          icon="pi pi-check"
          iconPos="right"
          class="w-full submit-btn"
          [disabled]="form.invalid"
          [loading]="loading">
        </button>
      </form>
    </ng-container>

    <ng-template #successTpl>
      <div class="success-state">
        <i class="pi pi-check-circle success-icon"></i>
        <p>Your password has been reset successfully!</p>
        <p class="hint-text">Redirecting to login page...</p>
      </div>
    </ng-template>

    <p class="back-link"><a routerLink="/auth/login"><i class="pi pi-arrow-left"></i> Back to sign in</a></p>
  </div>
</div>
