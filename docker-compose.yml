version: '3.8'

services:

  # ── MySQL (single instance, two schemas) ──────────────────────────
  mysql:
    image: mysql:8.0
    container_name: plansync-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: plansync_db_user
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Eureka Server ─────────────────────────────────────────────────
  eureka-server:
    build: ./backend/eureka-server
    container_name: plansync-eureka
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      EUREKA_INSTANCE_HOSTNAME: eureka-server
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  # ── Config Server ─────────────────────────────────────────────────
  config-server:
    build: ./backend/config-server
    container_name: plansync-config
    restart: unless-stopped
    ports:
      - "8888:8888"
    volumes:
      - ./backend/config-repo:/config-repo
    environment:
      CONFIG_REPO_PATH: /config-repo
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  # ── API Gateway ───────────────────────────────────────────────────
  api-gateway:
    build: ./backend/api-gateway
    container_name: plansync-gateway
    restart: unless-stopped
    ports:
      - "8085:8085"
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

  # ── User Service ──────────────────────────────────────────────────
  user-service:
    build: ./backend/user-service
    container_name: plansync-user
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: plansync_db_user
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      APP_AVATAR_PUBLIC_BASE_URL: http://localhost:8085
      APP_FRONTEND_URL: http://localhost:4200

  # ── Projet Service ────────────────────────────────────────────────
  projet-service:
    build: ./backend/projet-service
    container_name: plansync-projet
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      user-service:
        condition: service_started
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/plansync_projet_db?createDatabaseIfNotExist=true&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      USER_SERVICE_URL: http://user-service:8079
      APP_FRONTEND_URL: http://localhost:4200

  # ── Frontend (Angular → Nginx) ────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: plansync-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api-gateway

volumes:
  mysql_data:
